name: Build and Push Container

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "Dockerfile.production"
      - "compose.prod.yaml"
      - "requirements.txt"
      - assets/
      - reflex_gpt/
      - rxconfig.py
      - alembic.ini
      - alembic/
      - .github/workflows/build.yaml

env:
  # DOCKER_IMAGE: codingforentrepreneurs/reflex-gpt
  # uncomment if using 
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.7.1

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # For Reflex to build a container,
    # injecting your environment variables at 
    # container build time is often required.
    - name: Create build env file
      run: |
         cat << EOF > .build-env
         OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
         DATABASE_URL=${{ secrets.DATABASE_URL }}
         EOF

    - name: Check directory contents for Dockerfile
      run: ls -la


    - name: Echo Docker Buildx command
      run: echo "docker buildx build --push --tag ${{ env.DOCKER_IMAGE }}:latest --tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -f Dockerfile.production ."

    - name: Build and push with Docker Buildx (Verbose)
      run: |
        docker buildx create --use
        docker buildx build --progress=plain --push --tag ${{ env.DOCKER_IMAGE }}:latest --tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -f Dockerfile.production .

    
    - name: Remove build env file
      run: rm .build-env
